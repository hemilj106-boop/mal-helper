openapi: 3.1.0
info:
  title: Hanime Helper
  version: 0.1.0
  description: Search Hanime.tv and read the owner's authenticated Hanime account pages.
servers:
  - url: https://himel106j-hanime-sync.onrender.com
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the Hanime Helper API is reachable.
      security: []
      responses:
        "200":
          description: Service health status.
  /search:
    get:
      operationId: searchHanime
      summary: Search Hanime.tv by title or keywords.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Hanime search results.
  /video/{slug}:
    get:
      operationId: getHanimeVideo
      summary: Get details for a Hanime.tv video and its franchise episodes.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video details.
  /me/status:
    get:
      operationId: getHanimeAccountStatus
      summary: Check whether the owner's Hanime.tv account session is connected.
      responses:
        "200":
          description: Account connection status.
  /me/probe:
    get:
      operationId: probeHanimeAccountPages
      summary: Diagnose the available authenticated Hanime account pages such as favorites, history, playlists, and subscriptions.
      responses:
        "200":
          description: Account page diagnostics.
  /me/favorites:
    get:
      operationId: getHanimeFavorites
      summary: Read videos from the owner's Hanime favorites page.
      responses:
        "200":
          description: Favorite videos.
  /me/history:
    get:
      operationId: getHanimeHistory
      summary: Read videos from the owner's Hanime watch history page.
      responses:
        "200":
          description: Watch history.
  /me/playlists:
    get:
      operationId: getHanimePlaylists
      summary: Read the owner's Hanime playlists.
      responses:
        "200":
          description: Playlists.
  /disconnect:
    post:
      operationId: disconnectHanime
      summary: Delete the stored Hanime session from the helper.
      responses:
        "200":
          description: Session deleted.
components:
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
  securitySchemes:
    helperApiKey:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - helperApiKey: []
