services:
  - type: web
    name: mal-helper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MAL_CLIENT_ID
        sync: false
      - key: MAL_CLIENT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: HELPER_API_KEY
        generateValue: true
      - key: TOKEN_DB_PATH
        value: /tmp/tokens.db
